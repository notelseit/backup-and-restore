name: Shell checks
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Bash syntax
        run: bash -n bin/notelseit-backup bin/notelseit-restore tests/smoke.sh
      - name: ShellCheck
        run: shellcheck bin/notelseit-backup bin/notelseit-restore tests/smoke.sh
      - name: Smoke test
        run: bash tests/smoke.sh
